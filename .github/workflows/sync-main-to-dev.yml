name: Sync main to development

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-main-to-dev
  cancel-in-progress: false

jobs:
  sync:
    name: Back-merge main into development
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository with full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Merge main into development
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if ! git show-ref --verify --quiet refs/remotes/origin/development; then
            echo "Branch 'development' does not exist on origin; creating from main."
            git checkout -B development origin/main
            git push -u origin development
            exit 0
          fi

          git checkout -B development origin/development
          if git merge-base --is-ancestor origin/main development; then
            echo "development already contains all commits from main."
            exit 0
          fi

          if git merge --no-edit origin/main; then
            if git push origin development; then
              echo "Successfully synced main into development."
              exit 0
            fi
            # Branch protection blocked direct push — open a clean sync PR instead.
            SYNC_BRANCH="chore/sync-main-to-dev-${GITHUB_SHA::7}"
            git checkout -B "$SYNC_BRANCH"
            git push -u origin "$SYNC_BRANCH" --force
            gh pr create \
              --repo "${{ github.repository }}" \
              --base development \
              --head "$SYNC_BRANCH" \
              --title "chore: sync main into development (${GITHUB_SHA::7})" \
              --body "Automated back-merge of \`main\` into \`development\` after release/update."
          else
            git merge --abort || true
            echo "Merge conflict detected between main and development. Please merge main into development locally and resolve conflicts." >&2
            exit 1
          fi
