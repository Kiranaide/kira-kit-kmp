# Gradle Performance
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.configuration-cache=true

# Kotlin
kotlin.code.style=official
kotlin.mpp.enableCInteropCommonization=true

# Android
android.useAndroidX=true
android.nonTransitiveRClass=true

# Publishing Metadata (GitHub Pages Static Maven / Custom Self-Hosted / Maven Central Portal)
GROUP=io.github.kiranaide
# x-release-please-start-version
VERSION_NAME=0.2.0
# x-release-please-end
mavenCentralPublishing=true
mavenCentralAutomaticPublishing=true
RELEASE_SIGNING_ENABLED=false

POM_URL=https://github.com/Kiranaide/kira-kit-kmp
POM_SCM_URL=https://github.com/Kiranaide/kira-kit-kmp
POM_SCM_CONNECTION=scm:git:git://github.com/Kiranaide/kira-kit-kmp.git
POM_SCM_DEV_CONNECTION=scm:git:ssh://git@github.com/Kiranaide/kira-kit-kmp.git
POM_LICENCE_NAME=MIT License
POM_LICENCE_URL=https://opensource.org/licenses/MIT
POM_LICENCE_DIST=repo
POM_DEVELOPER_ID=Kiranaide
POM_DEVELOPER_NAME=Kiranaide
POM_DEVELOPER_URL=https://github.com/Kiranaide
