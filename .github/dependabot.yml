version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    target-branch: development
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    commit-message:
      prefix: chore
      prefix-development: chore
      include: scope
    groups:
      compose-and-androidx:
        patterns:
          - org.jetbrains.compose*
          - androidx.*
          - com.composables:*
      kotlin-ecosystem:
        patterns:
          - org.jetbrains.kotlin*
          - org.jetbrains.kotlinx*

  - package-ecosystem: github-actions
    directory: /
    target-branch: development
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci
      include: scope
    groups:
      github-actions:
        patterns:
          - "*"
